# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# (ou --spring.profiles.active=postgres). Suba o banco com: docker compose up -d
spring.datasource.url=jdbc:postgresql://localhost:5432/oficina
spring.datasource.username=${DB_USER:oficina}
spring.datasource.password=${DB_PASSWORD:oficina}
spring.h2.console.enabled=false
