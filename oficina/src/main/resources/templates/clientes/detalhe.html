<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho(${cliente.nome})}"></head>
<body>
<header th:replace="~{fragments/layout :: menu('clientes')}"></header>

<main class="conteudo">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="cabecalho-pagina">
        <h1 th:text="${cliente.nome}">Nome do cliente</h1>
        <div class="acoes">
            <a class="botao" th:href="@{/clientes/{id}/editar(id=${cliente.id})}">Editar</a>
            <a class="botao" th:href="@{/clientes}">Voltar</a>
        </div>
    </div>

    <section class="caixa">
        <dl class="dados">
            <div><dt>CPF</dt><dd th:text="${cliente.cpfFormatado}">000.000.000-00</dd></div>
            <div><dt>Telefone</dt><dd th:text="${cliente.telefone != null} ? ${cliente.telefone} : '-'">-</dd></div>
            <div><dt>E-mail</dt><dd th:text="${cliente.email != null} ? ${cliente.email} : '-'">-</dd></div>
        </dl>
    </section>

    <div class="cabecalho-pagina">
        <h2>Veículos</h2>
        <a class="botao primario" th:href="@{/veiculos/novo(clienteId=${cliente.id})}">Adicionar veículo</a>
    </div>

    <p class="vazio" th:if="${veiculos.isEmpty()}">Este cliente ainda não tem veículos cadastrados.</p>

    <div class="tabela-caixa" th:unless="${veiculos.isEmpty()}">
        <table class="tabela">
            <thead>
            <tr>
                <th>Placa</th>
                <th>Veículo</th>
                <th>Ano</th>
                <th>Cor</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${veiculos}">
                <td data-label="Placa"><a th:href="@{/veiculos/{id}(id=${v.id})}" th:text="${v.placa}">ABC1D23</a></td>
                <td data-label="Veículo" th:text="${v.marca} + ' ' + ${v.modelo}">Marca Modelo</td>
                <td data-label="Ano" th:text="${v.ano}">2020</td>
                <td data-label="Cor" th:text="${v.cor != null} ? ${v.cor} : '-'">-</td>
                <td class="acoes">
                    <a class="botao pequeno" th:href="@{/ordens/nova(veiculoId=${v.id})}">Abrir ordem</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <form th:if="${ehGerente}" th:action="@{/clientes/{id}/excluir(id=${cliente.id})}" method="post"
          data-confirmar="Excluir este cliente?">
        <button class="botao perigo" type="submit">Excluir cliente</button>
    </form>
</main>
</body>
</html>
