<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Veículos')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu('veiculos')}"></header>

<main class="conteudo">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="cabecalho-pagina">
        <h1>Veículos</h1>
        <a class="botao primario" th:href="@{/veiculos/novo}">Novo veículo</a>
    </div>

    <p class="vazio" th:if="${veiculos.isEmpty()}">
        Nenhum veículo cadastrado.
        <a th:href="@{/veiculos/novo}">Cadastrar um veículo</a>
    </p>

    <div class="tabela-caixa" th:unless="${veiculos.isEmpty()}">
        <table class="tabela">
            <thead>
            <tr>
                <th>Placa</th>
                <th>Veículo</th>
                <th>Ano</th>
                <th>Cor</th>
                <th>Dono</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${veiculos}">
                <td data-label="Placa"><a th:href="@{/veiculos/{id}(id=${v.id})}" th:text="${v.placa}">ABC1D23</a></td>
                <td data-label="Veículo" th:text="${v.marca} + ' ' + ${v.modelo}">Marca Modelo</td>
                <td data-label="Ano" th:text="${v.ano}">2020</td>
                <td data-label="Cor" th:text="${v.cor != null} ? ${v.cor} : '-'">-</td>
                <td data-label="Dono"><a th:href="@{/clientes/{id}(id=${v.cliente.id})}" th:text="${v.cliente.nome}">Dono</a></td>
                <td class="acoes">
                    <a class="botao pequeno" th:href="@{/ordens/nova(veiculoId=${v.id})}">Abrir ordem</a>
                    <a class="botao pequeno" th:href="@{/veiculos/{id}/editar(id=${v.id})}">Editar</a>
                    <form th:if="${ehGerente}" th:action="@{/veiculos/{id}/excluir(id=${v.id})}" method="post"
                          data-confirmar="Excluir este veículo?">
                        <button class="botao pequeno perigo" type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
