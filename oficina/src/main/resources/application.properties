spring.application.name=oficina
server.port=8080

# --- Banco de dados: H2 gravando em arquivo (pasta ./data), não precisa instalar nada ---
spring.datasource.url=jdbc:h2:file:./data/oficina
spring.datasource.username=sa
spring.datasource.password=

# Console do H2 para consultar as tabelas pelo navegador: http://localhost:8080/h2-console
# (só o gerente acessa; só aceita conexões da própria máquina)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

# --- JPA / Hibernate ---
# "update" cria e ajusta as tabelas conforme as entidades, sem apagar os dados
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# mantém a sessão aberta até a página ser renderizada (o Thymeleaf lê as listas das entidades)
spring.jpa.open-in-view=true

# --- Thymeleaf e mensagens ---
spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# --- Idioma e acentuação ---
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- Segurança ---
# a aplicação não recebe upload de arquivos, então esse recurso fica desligado
spring.servlet.multipart.enabled=false
# nunca mostrar stack trace nem mensagens internas nas páginas de erro
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
# sessão expira após 30 min sem uso; cookie inacessível para JavaScript e não vai em requisição de outro site
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Senhas iniciais dos usuários "gerente" e "atendente" (criados na primeira execução).
# Para trocar sem editar o arquivo, defina as variáveis de ambiente OFICINA_SENHA_GERENTE e OFICINA_SENHA_ATENDENTE.
oficina.seguranca.senha-gerente=${OFICINA_SENHA_GERENTE:Gerente-2026}
oficina.seguranca.senha-atendente=${OFICINA_SENHA_ATENDENTE:Atendente-2026}
